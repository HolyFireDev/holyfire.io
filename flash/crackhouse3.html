<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>crackhouse cleanup part 3</title>
<style>
  html, body { height: 100%; }
  body { margin: 0; background: #000; color: #fff; font-family: Arial, Helvetica, sans-serif; font-size: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  p { margin: 0; }
  a { color: #fff; }
  #nav { position: fixed; top: 16px; left: 16px; }
  #game { width: 360px; height: 288px; max-width: 100vw; max-height: 100vh; }
  #hint { position: fixed; bottom: 16px; left: 16px; }
</style>
</head>
<body>
  <p id="nav"><a href="/">Holy Fire</a> / <a href="/flash/">flash</a> / crackhouse cleanup part 3</p>
  <div id="game"></div>
  <p id="hint">click the game once so it gets the keyboard</p>
  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
  <script>
    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = { autoplay: "on", unmuteOverlay: "visible", letterbox: "on", scale: "showAll", backgroundColor: "#000000", allowScriptAccess: false, quality: "high", warnOnUnsupportedContent: false, spoofUrl: "http://teamjaruno.com/webarchive/stickdeath.com/chc3.swf" };
    window.addEventListener("load", function () {
      var player = window.RufflePlayer.newest().createPlayer();
      player.style.width = "100%"; player.style.height = "100%";
      document.getElementById("game").appendChild(player);
      player.load("/flash/crackhouse3.swf");
    });
  </script>
</body>
</html>
