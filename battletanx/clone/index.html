var AC=null, OPT={sfx:0.8,music:0.5,diff:0,powerups:true,regen:true,basedef:true,unlimited:false};

  show("<div class='scr rust'><div class='frame'></div><div class='ttl'>CONTROLLER CONFIG</div><div class='center' style='padding-top:3em'><table class='k'><tr><td></td><td>DRIVE</td><td>CANNON (Z)</td><td>SPECIAL (A)</td><td>CYCLE (B)</td><td>STRAFE (C)</td><td>PAUSE</td></tr><tr><td>P1</td><td>W A S D</td><td>SPACE</td><td>F</td><td>R</td><td>Q / E</td><td>ESC</td></tr><tr><td>P2</td><td>ARROWS</td><td>ENTER</td><td>SHIFT</td><td>/</td><td>, / .</td><td>ESC</td></tr><tr><td>P3</td><td>I J K L</td><td>H</td><td>G</td><td>Y</td><td>U / O</td><td>ESC</td></tr><tr><td>P4</td><td>NUMPAD 8 4 5 6</td><td>NUMPAD 0</td><td>NUMPAD 1</td><td>NUMPAD 3</td><td>NUMPAD 7 / 9</td><td>ESC</td></tr><tr><td>PAD</td><td>STICK / D-PAD</td><td>RT or X</td><td>A</td><td>B</td><td>LB / RB</td><td>START</td></tr></table><div class='small' style='margin-top:1.2em'>Gamepads 1-4 map to players 1-4. Press A or B to go back.</div></div></div>"); }
function screen_credits(){ cur={name:"credits",sel:0,handler:function(ev){ if(ev==="a"||ev==="b"){ sfx("back"); screen_setup(); } }};
  show("<div class='scr city'><div class='ttl'>CREDITS</div><div class='center' style='padding-top:2em'><div class='small' style='font-size:.8em;line-height:1.8'>A browser homage to BattleTanx (3DO, 1998).<br>Deathmatch and Battlelord modes, split-screen 1-4, online rooms.<br>Built from a frame-by-frame playthrough of the N64 original.<br><br>Original game, characters and names are property of their owners.<br>Press A or B to go back.</div></div></div>"); }
function screen_code(status,code){
  cur={name:"code",sel:0,handler:function(ev){ if(ev==="b"){ sfx("back"); if(net.peer){ try{ net.peer.destroy(); }catch(e){} } net.role=null; net.peer=null; screen_setup(); } if(ev==="a"&&!net.role){ var inp=document.getElementById("code"); if(inp&&inp.value.trim().length===4) doJoin(); else if(!inp||!inp.value.trim()){ hostRoom(); } } }};
  function doJoin(){ var c=document.getElementById("code").value.trim(); var nm=(document.getElementById("nm").value.trim()||"PLAYER").toUpperCase(); try{ localStorage.setItem("btxname",nm); }catch(e){} sfx("select"); joinRoom(c,nm,S.slots[0].gang); }
  show("<div class='scr rust'><div class='frame'></div><div class='ttl'>INPUT CODE</div><div class='center' style='padding-top:2em'>"+(status?"<div class='press' style='animation:none;font-size:1em'>"+status+(code?"<br><span style='font-size:1.8em;color:#fff'>"+code+"</span>":"")+"</div>":"")+(net.role?"":"<div class='small' style='margin-bottom:1em'>Play with friends on their own screens. The host gets a 4-letter code.<br>Everyone needs the page password. Peer-to-peer, same continent works best.</div><div style='margin:.4em'>NAME <input id='nm' maxlength='10' style='width:6em' value='"+(localStorage.getItem("btxname")||"")+"'></div><div style='margin:.4em'>CODE <input id='code' maxlength='4' style='width:4em'> <span class='it' id='join' style='font-size:1em'>JOIN</span></div><div style='margin:1em'><span class='it sel' id='host' style='font-size:1.1em'>HOST A ROOM</span></div>")+"<div class='small' style='margin-top:1em'>B = back</div></div></div>");
  var hb=document.getElementById("host"), jb=document.getElementById("join"); if(hb) hb.onclick=function(){ sfx("select"); hostRoom(); }; if(jb) jb.onclick=doJoin; var ci=document.getElementById("code"); if(ci){ ci.onkeydown=function(e){ if(e.key==="Enter") doJoin(); e.stopPropagation(); }; document.getElementById("nm").onkeydown=function(e){ e.stopPropagation(); }; }
}
function screen_lobby(code){ var names=[net.names.host].concat(net.conns.map(function(c){ return net.names[c.peer]||"..."; })); net.conns.forEach(function(c){ if(c.open) c.send({t:"lobby",names:names}); });
  cur={name:"lobby",sel:0,handler:function(ev){ if(ev==="b"){ sfx("back"); location.reload(); } if(ev==="a"){ sfx("select"); S.players=1; S.slots[0].human=true; for(var i=1;i<4;i++){ S.slots[i].human=i<=net.conns.length; if(S.slots[i].human) S.slots[i].skill=1; } screen_team(); } }};
  show("<div class='scr rust'><div class='frame'></div><div class='ttl'>ROOM "+code+"</div><div class='center' style='padding-top:2em'><div class='small' style='font-size:.8em'>Friends: open this page, enter the password, choose INPUT CODE, type <b style='color:#ffd21a;font-size:1.4em'>"+code+"</b> and JOIN.</div><div style='margin:1em;color:#fff'>"+names.join(" &nbsp; ")+"</div><div class='it sel' data-i='0' style='font-size:1.2em'>CONTINUE TO TEAM ALIGNMENT</div><div class='small' style='margin-top:1em'>Empty seats become computer tanks. B = cancel</div></div></div>"); clickable(); }
function screen_wait(code,names){ cur={name:"wait",sel:0,handler:function(ev){ if(ev==="b"){ location.reload(); } }}; show("<div class='scr rust'><div class='frame'></div><div class='ttl'>ROOM "+code.toUpperCase()+"</div><div class='center'><div style='color:#fff'>"+(names.length?names.join(" &nbsp; "):"CONNECTING...")+"</div><div class='small' style='margin-top:1em'>Waiting for the host to start.<br>You drive with the player 1 keys or gamepad 1. B = leave</div></div></div>"); }
function screen_team(){
  cur={name:"team",sel:0,handler:function(ev){ var sl=S.slots[cur.sel];
    if(ev==="up"){ cur.sel=(cur.sel+3)%4; sfx("tick"); } else if(ev==="down"){ cur.sel=(cur.sel+1)%4; sfx("tick"); }
    else if(ev==="left"||ev==="right"){ var d=ev==="left"?-1:1; if(sl.human){ sl.team=(sl.team+d+4)%4; } else { sl.skill=(sl.skill+d+4)%4; } sfx("tick"); saveS(); }
    else if(ev==="a"){ sfx("select"); saveS(); return screen_gang(0); } else if(ev==="b"){ sfx("back"); return net.role?screen_lobby(net.code):screen_setup(); }
    draw(); },help:helpBox("TEAM ALIGNMENT",[["L R","CHOOSE TEAM"],["▲▼","HIGHLIGHT OPTION"],["◀▶","CHANGE OPTION"],["B","PREVIOUS SCREEN"],["A","DONE"]])};
  function draw(){ var cells=S.slots.map(function(sl,i){ var off=!sl.human&&sl.skill===0; var bg=off?"#555":TEAMS[sl.team].css; return "<div class='slot"+(off?" off":"")+(i===cur.sel?" sel":"")+"' data-i='"+i+"' style='background:"+bg+"'><div class='h'>"+(sl.human?"HUMAN":"COMPUTER")+"</div><div class='s'>"+(sl.human?"NORMAL":["OFF","EASY","NORMAL","HARD"][sl.skill])+"</div><div class='t'>"+(off?"NONE":"TEAM "+TEAMS[sl.team].n)+"</div></div>"; }).join(""); show("<div class='scr rust'><div class='frame'></div><div class='ttl'>TEAM ALIGNMENT</div><div class='team'>"+cells+"</div><div class='help'><b>Z</b>HELP</div></div>"); ui.querySelectorAll("[data-i]").forEach(function(el){ el.onclick=function(){ var i=+el.getAttribute("data-i"); if(cur.sel===i) cur.handler("right"); else { cur.sel=i; draw(); } }; }); }
  draw();
}
function screen_gang(p){
  while(p<4&&!(S.slots[p].human&&(net.role?p===0:true))) p++;
  if(p>=4) return screen_map();
  var showTank=false;
  cur={name:"gang",sel:S.slots[p].gang,handler:function(ev){
    if(ev==="left"){ cur.sel=(cur.sel+6)%7; sfx("tick"); } else if(ev==="right"){ cur.sel=(cur.sel+1)%7; sfx("tick"); } else if(ev==="up"||ev==="down"){ showTank=!showTank; sfx("tick"); }
    else if(ev==="a"){ S.slots[p].gang=cur.sel; saveS(); sfx("select"); if(net.role==="host"){ net.conns.forEach(function(c,ci){ S.slots[ci+1].gang=net.gangs[c.peer]||0; }); } return screen_gang(p+1); } else if(ev==="b"){ sfx("back"); return p===0?screen_team():screen_gang(p-1>=0?0:0); }
    draw(); },help:helpBox("CHOOSE GANG",[["L R","CHOOSE TEAM"],["▲▼","SHOW GANG-TANKS"],["◀▶","SELECT GANG"],["B","PREVIOUS SCREEN"],["A","DONE"]])};
  function draw(){ var cards=""; for(var i=0;i<4;i++){ var sl=S.slots[i]; if(i===p){ var g=GANGS[cur.sel]; cards+="<div class='gang sel'><div class='art' style='color:"+TEAMS[sl.team].css+"'>"+(showTank?"<span style=\"font-size:.5em\">"+TANKS[g.tank].n+"<br>"+WEAP[g.sp].n+"</span>":g.art)+"</div><div class='nm'>"+g.n+"</div></div>"; } else if(i<p&&sl.human){ cards+="<div class='gang'><div class='done'>✓</div><div class='art' style='color:"+TEAMS[sl.team].css+";opacity:.5'>"+GANGS[sl.gang].art+"</div><div class='nm'>"+GANGS[sl.gang].n+"</div></div>"; } else cards+="<div class='gang' style='background:#1a1a1a'></div>"; }
    show("<div class='scr rust'><div class='frame'></div><div class='ttl'>CHOOSE GANG</div><div class='gangs'>"+cards+"</div><div class='help'><b>Z</b>HELP &nbsp; &nbsp; PLAYER "+(p+1)+"</div></div>"); ui.querySelector(".gang.sel").onclick=function(){ cur.handler("a"); }; }
  draw();
}
function thumbData(ai){ var c=document.createElement("canvas"); c.width=48; c.height=36; var g=c.getContext("2d"), A=ARENAS[ai], r=mulberry(ai*77+5); g.fillStyle=hex(A.ground); g.fillRect(0,0,48,36); if(A.water){ g.fillStyle="#2a4a7a"; g.fillRect(0,0,48,8); } g.fillStyle="rgba(0,0,0,.45)"; for(var i=0;i<18*A.density;i++) g.fillRect(4+r()*38,4+r()*26,2+r()*5,2+r()*5); g.fillStyle="#ffd21a"; g.fillRect(23,17,2,2); return c.toDataURL(); }
function screen_map(){
  cur={name:"map",sel:S.arena,handler:function(ev){ if(ev==="left"){ cur.sel=(cur.sel+7)%8; sfx("tick"); } else if(ev==="right"){ cur.sel=(cur.sel+1)%8; sfx("tick"); } else if(ev==="a"){ S.arena=cur.sel; saveS(); sfx("select"); return screen_rumble(); } else if(ev==="b"){ sfx("back"); return screen_gang(0); } draw(); },help:helpBox("OCCUPIED TERRITORIES",[["◀▶","HIGHLIGHT TERRITORY"],["B","PREVIOUS SCREEN"],["A","SELECT"]])};
  function draw(){ var A=ARENAS[cur.sel]; var dots=ARENAS.map(function(a,i){ return "<div class='dot"+(i===cur.sel?" sel":"")+"' data-i='"+i+"' style='left:"+a.dot[0]+"%;top:"+a.dot[1]+"%'></div>"; }).join(""); show("<div class='scr rust'><div class='frame'></div><div class='ttl'>OCCUPIED TERRITORIES</div><div class='mapbox'><div class='mapname'>"+A.n+"</div><div class='usa'>"+dots+"</div><div class='diff'>"+A.diff+"</div><img class='thumb' src='"+thumbData(cur.sel)+"'></div><div class='help'><b>Z</b>HELP</div></div>"); ui.querySelectorAll("[data-i]").forEach(function(el){ el.onclick=function(){ var i=+el.getAttribute("data-i"); if(cur.sel===i) cur.handler("a"); else { cur.sel=i; sfx("tick"); draw(); } }; }); }
  draw();
}
function screen_rumble(){ cur={name:"rumble",sel:0,handler:function(ev){ if(ev==="a"){ sfx("select"); startGame(); } else if(ev==="b"){ sfx("back"); screen_map(); } }};
  show("<div class='scr' style='background:#000'><div class='center'><div style='color:#e8321a;font-size:1.6em;text-shadow:.07em .07em 0 #000;transform:scaleY(1.2)'>Insert Rumble Paks Now</div><div style='height:2em'></div><div class='press' data-i='0' style='color:#fff;font-size:.8em;animation:none'>PRESS A TO CONTINUE</div></div></div>"); clickable(); }
function startGame(){ hideUI(); clearScene(); cams=[]; newGame(); running=true; paused=false; lastT=performance.now(); musicStart(); sfx("banner"); requestAnimationFrame(loop); }
function togglePause(){ if(!running||net.role==="client"||!G||G.over) return; paused=!paused; if(paused){ pauseSel=0; drawPause(); sfx("select"); } else { hideUI(); cur={name:null,handler:null}; } }
function drawPause(){ var rows=["CONTINUE","RESTART","QUIT GAME"]; cur={name:"pause",sel:pauseSel,handler:function(ev){ if(ev==="up"){ pauseSel=(pauseSel+2)%3; sfx("tick"); drawPause(); } else if(ev==="down"){ pauseSel=(pauseSel+1)%3; sfx("tick"); drawPause(); } else if(ev==="a"){ sfx("select"); if(pauseSel===0) togglePause(); else if(pauseSel===1){ paused=false; hideUI(); clearScene(); cams=[]; newGame(); sfx("banner"); } else { quitToSetup(); } } else if(ev==="b"){ togglePause(); } }};
  show("<div style='position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:transparent'><div class='wood' style='font-size:min(3vw,4vh)'>"+rows.map(function(r,i){ return "<div class='it"+(i===pauseSel?" sel":"")+"' data-i='"+i+"'>"+r+"</div>"; }).join("")+"</div></div>"); ui.style.background="transparent"; clickable(); }
function quitToSetup(){ running=false; paused=false; enginesOff(); musicStop(); clearScene(); G=null; ui.style.background="#000"; if(net.role){ location.reload(); return; } screen_setup(); }
function showResults(){ if(!G) return; running=false; enginesOff(); musicStop(); var rows=G.tanks.slice().sort(function(a,b){ return (b.caps*100+b.kills)-(a.caps*100+a.kills); }).map(function(t){ return "<tr><td style='color:"+TEAMS[t.team].css+"'>"+t.name+"</td><td>"+GANGS[t.gang].n+"</td><td>"+t.kills+"</td><td>"+t.deaths+"</td>"+(G.mode==="bl"?"<td>"+t.caps+"</td>":"")+"</tr>"; }).join("");
  cur={name:"results",sel:0,handler:function(ev){ if(net.role==="client"){ if(ev==="b") location.reload(); return; } if(ev==="a"){ sfx("select"); ui.style.background="#000"; hideUI(); clearScene(); cams=[]; newGame(); running=true; paused=false; lastT=performance.now(); musicStart(); sfx("banner"); requestAnimationFrame(loop); } else if(ev==="b"){ sfx("back"); quitToSetup(); } }};
  ui.style.background="#000"; show("<div class='scr rust'><div class='frame'></div><div class='ttl'>"+G.tanks[G.winner].name+" WINS</div><div class='center' style='padding-top:2em'><table class='k' style='font-size:.75em'><tr><td>TANK</td><td>GANG</td><td>KILLS</td><td>DEATHS</td>"+(G.mode==="bl"?"<td>QUEENS</td>":"")+"</tr>"+rows+"</table><div style='margin-top:1.5em'>"+(net.role==="client"?"<div class='small'>Waiting for the host. B = leave</div>":"<span class='it sel' data-i='0' style='font-size:1.1em'>REMATCH</span> &nbsp; <span class='small'>&nbsp; B = GAME SETUP</span>")+"</div></div></div>"); clickable(); }

/* ================= GATE ================= */
document.addEventListener("pointerdown",function(){ ac(); },{once:true});
function gate(){ var ok=false; try{ var qp=new URLSearchParams(location.search); if(qp.get("pw")===PASS) sessionStorage.setItem("btx","1"); ok=sessionStorage.getItem("btx")==="1"; if(ok&&qp.get("auto")){ S.players=1; S.mode=qp.get("auto")==="bl"?"bl":"dm"; S.arena=+(qp.get("arena")||0); S.slots[1].skill=2; S.slots[2].skill=2; startGame(); render(0); return; } }catch(e){} if(ok){ screen_title(); return; }
  cur={name:"gate",handler:function(){}}; show("<div class='scr' style='background:#000'><div class='center'><div class='ttl' style='position:static;font-size:2.4em'>BATTLETANX</div><div class='small' style='margin:1em'>Restricted area. Enter the password.</div><input id='pw' type='password' style='text-transform:none'> <span class='it sel' id='go' style='font-size:1em'>ENTER</span><div id='msg' class='small' style='color:#e8321a;margin-top:.6em;min-height:1em'></div></div></div>");
  var inp=document.getElementById("pw"); function tryIt(){ if(inp.value===PASS){ try{ sessionStorage.setItem("btx","1"); }catch(e){} sfx("select"); screen_title(); } else { document.getElementById("msg").textContent="Wrong. Three of something."; inp.value=""; } }
  document.getElementById("go").onclick=tryIt; inp.onkeydown=function(e){ e.stopPropagation(); if(e.key==="Enter") tryIt(); }; inp.focus(); }
gate();
setInterval(function(){ if(ui.style.display!=="none") pollPads(); },50);
})();
</script>
