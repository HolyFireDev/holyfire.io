<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>BattleTanx</title>
<style>
  html,body{margin:0;background:#000;color:#eee;font-family:Impact,"Arial Black",Verdana,sans-serif;letter-spacing:1px;overflow:hidden}
  #wrap{position:relative;width:100vw;height:100vh;background:#000}

  .panel{background:#141414;border:4px solid #f90;padding:22px 30px;min-width:380px;max-width:92%;max-height:92vh;overflow:auto;box-shadow:0 0 40px #f90}
  h1{margin:0 0 8px;font-size:46px;color:#f90;text-shadow:3px 3px #600;letter-spacing:3px}

</style>
</head>
<body>
<div id="wrap">
  <canvas id="gl"></canvas>
  <canvas id="hud"></canvas>
  <div id="ui"></div>
  <div id="help">P1 WASD+Space (Q/E strafe) | P2 Arrows+Enter | P3 IJKL+H | P4 Numpad 8456+0 | Gamepads: stick/d-pad, A fire, B strafe | Esc menu | <a href="/">home</a></div>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(function(){
"use strict";
var PASS="!!!";
var glc=document.getElementById("gl"), hud=document.getElementById("hud"), hx=hud.getContext("2d"), ui=document.getElementById("ui");
var renderer=new THREE.WebGLRenderer({canvas:glc,antialias:false}); renderer.setPixelRatio(1);
var RW=640, RH=400; // low-res N64 feel, scaled up by CSS

window.addEventListener("resize",fit); fit();

/* ---------- data ---------- */
var TANKS={abrams:{n:"M1A1 Abrams",hp:100,spd:11,turn:2.2,dmg:1,col:0x6b7a3a,size:[2.2,0.9,3.2]},goliath:{n:"Goliath",hp:170,spd:7.5,turn:1.5,dmg:1.5,col:0x4a4a52,size:[2.8,1.2,3.8]},moto:{n:"Moto-Tank",hp:65,spd:16,turn:3.2,dmg:0.8,col:0x8a2a2a,size:[1.6,0.7,2.6]}};

var PICKS=["missile","swarm","laser","flame","nuke","mine","health","shield","missile","swarm","health"];
var COLORS=["#3fa9f5","#f54242","#4cd964","#ffd500"], CSS=[0x3fa9f5,0xf54242,0x4cd964,0xffd500];
var KEYS=[{u:"w",d:"s",l:"a",r:"d",f:" ",sl:"q",sr:"e"},{u:"ArrowUp",d:"ArrowDown",l:"ArrowLeft",r:"ArrowRight",f:"Enter",sl:",",sr:"."},{u:"i",d:"k",l:"j",r:"l",f:"h",sl:"u",sr:"o"},{u:"np8",d:"np5",l:"np4",r:"np6",f:"np0",sl:"np7",sr:"np9"}];
var MAP=120, HALF=60;
var keys={};
document.addEventListener("keydown",function(e){ if(e.target&&e.target.tagName==="INPUT") return; keys[e.key.length===1?e.key.toLowerCase():e.key]=true; if(e.code&&e.code.indexOf("Numpad")===0) keys["np"+e.code.slice(6)]=true; if([" ","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].indexOf(e.key)>=0) e.preventDefault(); if(e.key==="Escape") toggleMenu(); });
document.addEventListener("keyup",function(e){ keys[e.key.length===1?e.key.toLowerCase():e.key]=false; if(e.code&&e.code.indexOf("Numpad")===0) keys["np"+e.code.slice(6)]=false; });
window.addEventListener("blur",function(){ keys={}; });

/* ---------- audio ---------- */
var AC=null; function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC&&AC.state==="suspended") AC.resume(); return AC; }
function sfx(kind){ var a=ac(); if(!a) return; var t=a.currentTime, o=a.createOscillator(), g=a.createGain(); o.connect(g); g.connect(a.destination);
  if(kind==="fire"){ o.type="square"; o.frequency.setValueAtTime(200,t); o.frequency.exponentialRampToValueAtTime(50,t+0.14); g.gain.setValueAtTime(0.12,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.16); o.start(t); o.stop(t+0.16); }
  else if(kind==="laser"){ o.type="sawtooth"; o.frequency.setValueAtTime(1200,t); o.frequency.exponentialRampToValueAtTime(300,t+0.2); g.gain.setValueAtTime(0.08,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.2); o.start(t); o.stop(t+0.2); }
  else if(kind==="boom"||kind==="nuke"){ var n=a.createBufferSource(), b=a.createBuffer(1,a.sampleRate*(kind==="nuke"?1.6:0.5),a.sampleRate), d=b.getChannelData(0); for(var i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2); n.buffer=b; var f=a.createBiquadFilter(); f.type="lowpass"; f.frequency.value=kind==="nuke"?300:700; n.connect(f); f.connect(g); g.gain.setValueAtTime(kind==="nuke"?0.9:0.4,t); g.gain.exponentialRampToValueAtTime(0.001,t+(kind==="nuke"?1.6:0.5)); n.start(t); o.frequency.value=35; o.type="sine"; o.start(t); o.stop(t+0.3); }
  else if(kind==="pick"){ o.type="triangle"; o.frequency.setValueAtTime(600,t); o.frequency.setValueAtTime(900,t+0.08); g.gain.setValueAtTime(0.15,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.25); o.start(t); o.stop(t+0.25); }
  else if(kind==="queen"){ o.type="triangle"; [440,554,659,880].forEach(function(f,i){ o.frequency.setValueAtTime(f,t+i*0.1); }); g.gain.setValueAtTime(0.15,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.5); o.start(t); o.stop(t+0.5); }
}
document.addEventListener("pointerdown",function(){ ac(); },{once:true});

/* ---------- three scene ---------- */
var scene=new THREE.Scene(); scene.background=new THREE.Color(0x1a1a28); scene.fog=new THREE.Fog(0x1a1a28,40,110);
scene.add(new THREE.HemisphereLight(0x8899bb,0x332211,0.9)); var sun=new THREE.DirectionalLight(0xffeedd,0.8); sun.position.set(30,60,20); scene.add(sun);
function canvasTex(fn,w,h){ var c=document.createElement("canvas"); c.width=w; c.height=h; fn(c.getContext("2d"),w,h); var t=new THREE.CanvasTexture(c); t.magFilter=THREE.NearestFilter; t.minFilter=THREE.NearestFilter; return t; }
var groundTex=canvasTex(function(g,w,h){ g.fillStyle="#3a3a3a"; g.fillRect(0,0,w,h); g.fillStyle="#444"; for(var i=0;i<400;i++) g.fillRect(Math.random()*w,Math.random()*h,2,2); g.strokeStyle="#2a2a2a"; g.lineWidth=2; g.strokeRect(1,1,w-2,h-2); },64,64); groundTex.wrapS=groundTex.wrapT=THREE.RepeatWrapping; groundTex.repeat.set(30,30);
var ground=new THREE.Mesh(new THREE.PlaneGeometry(MAP+40,MAP+40),new THREE.MeshLambertMaterial({map:groundTex})); ground.rotation.x=-Math.PI/2; scene.add(ground);
var wallTexs=[0x7a6a5a,0x5a6a7a,0x6a5a4a,0x55605a].map(function(col){ return canvasTex(function(g,w,h){ g.fillStyle="#"+col.toString(16); g.fillRect(0,0,w,h); for(var y=6;y<h-6;y+=12) for(var x=4;x<w-4;x+=10){ g.fillStyle=Math.random()<0.6?"#ffe9a0":"#111"; g.fillRect(x,y,5,7); } },64,64); });
wallTexs.forEach(function(t){ t.wrapS=t.wrapT=THREE.RepeatWrapping; });
var rubbleMat=new THREE.MeshLambertMaterial({color:0x4a4040});
var borderMat=new THREE.MeshLambertMaterial({color:0x303030});
var cityGroup=new THREE.Group(); scene.add(cityGroup);

function buildCity(seed){
  while(cityGroup.children.length) cityGroup.remove(cityGroup.children[0]);
  var r=mulberry(seed), walls=[];
  function add(x,z,w,d,h,hp,mat){ var geo=new THREE.BoxGeometry(w,h,d), m=mat; if(!m){ var t=wallTexs[Math.floor(r()*wallTexs.length)].clone(); t.needsUpdate=true; t.repeat.set(Math.max(1,Math.round(w/4)),Math.max(1,Math.round(h/4))); m=new THREE.MeshLambertMaterial({map:t}); } var mesh=new THREE.Mesh(geo,m); mesh.position.set(x,h/2,z); cityGroup.add(mesh); walls.push({x:x,z:z,w:w,d:d,h:h,hp:hp,mesh:mesh,maxhp:hp}); }
  add(0,-HALF-5,MAP+20,10,6,1e9,borderMat); add(0,HALF+5,MAP+20,10,6,1e9,borderMat); add(-HALF-5,0,10,MAP+20,6,1e9,borderMat); add(HALF+5,0,10,MAP+20,6,1e9,borderMat);
  for(var gx=-2;gx<=2;gx++) for(var gz=-2;gz<=2;gz++){ if(Math.abs(gx)===2&&Math.abs(gz)===2) continue; if(gx===0&&gz===0) continue; var bx=gx*22, bz=gz*22; var n=1+Math.floor(r()*2); for(var k=0;k<n;k++){ var w=5+r()*7, d=5+r()*7, h=4+r()*12; add(bx+(r()-0.5)*8,bz+(r()-0.5)*8,w,d,h,3); } }
  return walls;
}
function mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; var t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

function tankMesh(type,ci){
  var T=TANKS[type], g=new THREE.Group(), s=T.size, body=new THREE.MeshLambertMaterial({color:T.col}), trim=new THREE.MeshLambertMaterial({color:CSS[ci]}), dark=new THREE.MeshLambertMaterial({color:0x222222});
  var hull=new THREE.Mesh(new THREE.BoxGeometry(s[0],s[1],s[2]),body); hull.position.y=s[1]/2+0.3; g.add(hull);
  var tl=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.7,s[2]+0.3),dark); tl.position.set(-s[0]/2-0.1,0.35,0); g.add(tl); var tr=tl.clone(); tr.position.x=s[0]/2+0.1; g.add(tr);
  if(type==="moto"){ var w1=new THREE.Mesh(new THREE.CylinderGeometry(0.5,0.5,0.4,8),dark); w1.rotation.z=Math.PI/2; w1.position.set(0,0.5,s[2]/2-0.3); g.add(w1); var w2=w1.clone(); w2.position.z=-s[2]/2+0.3; g.add(w2); }
  var tur=new THREE.Mesh(new THREE.BoxGeometry(s[0]*0.6,0.6,s[2]*0.45),trim); tur.position.y=s[1]+0.6; g.add(tur);
  var bar=new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.14,s[2]*0.9,6),dark); bar.rotation.x=Math.PI/2; bar.position.set(0,s[1]+0.6,s[2]*0.7); g.add(bar);
  var flag=new THREE.Mesh(new THREE.BoxGeometry(0.1,0.9,0.05),trim); flag.position.set(-s[0]/2+0.2,s[1]+1.4,-s[2]/2+0.3); g.add(flag);
  var sh=new THREE.Mesh(new THREE.SphereGeometry(Math.max(s[0],s[2])*0.8,10,8),new THREE.MeshBasicMaterial({color:0x66ccff,transparent:true,opacity:0.35,wireframe:true})); sh.position.y=1; sh.visible=false; g.add(sh); g.userData.shield=sh;
  return g;
}
var bulletGeo=new THREE.SphereGeometry(0.22,6,6), bulletMats={shell:new THREE.MeshBasicMaterial({color:0xffff66}),missile:new THREE.MeshBasicMaterial({color:0xff8800}),swarm:new THREE.MeshBasicMaterial({color:0xff44aa}),flame:new THREE.MeshBasicMaterial({color:0xff6600,transparent:true,opacity:0.8}),nuke:new THREE.MeshBasicMaterial({color:0xff00ff})};
var missileGeo=new THREE.ConeGeometry(0.2,0.9,6); missileGeo.rotateX(Math.PI/2);
var pickGeo=new THREE.OctahedronGeometry(0.8,0), pickMats={missile:0xff8800,swarm:0xff44aa,laser:0x66ff66,flame:0xff4400,nuke:0xff00ff,mine:0x999999,health:0x44ff44,shield:0x66ccff};
var mineGeo=new THREE.CylinderGeometry(0.5,0.6,0.2,8), mineMat=new THREE.MeshLambertMaterial({color:0x333333});
var queenMesh=null;
function makeQueen(){ var g=new THREE.Group(); var dress=new THREE.Mesh(new THREE.ConeGeometry(0.7,1.6,8),new THREE.MeshLambertMaterial({color:0xff2a8a})); dress.position.y=0.8; g.add(dress); var head=new THREE.Mesh(new THREE.SphereGeometry(0.32,8,8),new THREE.MeshLambertMaterial({color:0xffd9b3})); head.position.y=1.9; g.add(head); var crown=new THREE.Mesh(new THREE.CylinderGeometry(0.3,0.25,0.25,6),new THREE.MeshLambertMaterial({color:0xffd700})); crown.position.y=2.25; g.add(crown); var ring=new THREE.Mesh(new THREE.RingGeometry(1.2,1.6,16),new THREE.MeshBasicMaterial({color:0xff2a8a,side:THREE.DoubleSide})); ring.rotation.x=-Math.PI/2; ring.position.y=0.05; g.add(ring); return g; }
var fxGeo=new THREE.SphereGeometry(1,8,6);

/* ---------- game state ---------- */
var G=null, settings={local:1,bots:3,mode:"dm",target:10,tank:["abrams","abrams","abrams","abrams"]};
var net={role:null,peer:null,conns:[],host:null,inputs:{},id:null,names:{},tanks:{}};
var running=false, menuOpen=false, lastT=0, bt=0;
var SPAWNS=[[-50,-50],[50,50],[50,-50],[-50,50]];
var walls=[];
function newGame(){
  var seed=Math.floor(Math.random()*1e9); walls=buildCity(seed);
  G={seed:seed,tanks:[],bullets:[],pickups:[],mines:[],fx:[],mode:settings.mode,target:settings.target,time:0,over:false,winner:null,pickT:2,queen:null,bases:SPAWNS};
  function addTank(name,bot,owner,type){ var i=G.tanks.length, T=TANKS[type]; var t={i:i,name:name,bot:bot,owner:owner,type:type,x:SPAWNS[i][0],z:SPAWNS[i][1],a:Math.atan2(-SPAWNS[i][0],-SPAWNS[i][1]),hp:T.hp,maxhp:T.hp,lives:3,kills:0,deaths:0,score:0,alive:true,cd:0,w:"shell",ammo:0,shield:0,resp:0,inp:{u:0,d:0,l:0,r:0,f:0,sl:0,sr:0},ai:{t:0},mesh:tankMesh(type,i),vx:0,vz:0,hasQueen:false,hurt:0}; scene.add(t.mesh); G.tanks.push(t); return t; }
  if(net.role==="host"){ addTank(net.names[net.id]||"Host",false,net.id,settings.tank[0]); net.conns.forEach(function(c){ if(G.tanks.length<4) addTank(net.names[c.peer]||"P"+(G.tanks.length+1),false,c.peer,net.tanks[c.peer]||"abrams"); }); }
  else for(var n=0;n<settings.local;n++) addTank("Player "+(n+1),false,n,settings.tank[n]);
  var bn=["Rommel","Patton","Zhukov","Sherman"], types=Object.keys(TANKS); for(var b=0;b<settings.bots&&G.tanks.length<4;b++) addTank(bn[b],true,-1,types[Math.floor(Math.random()*types.length)]);
  if(G.mode==="queen") spawnQueen(0,0);
}
function clearScene(){ if(!G) return; G.tanks.forEach(function(t){ scene.remove(t.mesh); }); G.bullets.forEach(function(b){ scene.remove(b.mesh); }); G.pickups.forEach(function(p){ scene.remove(p.mesh); }); G.mines.forEach(function(m){ scene.remove(m.mesh); }); G.fx.forEach(function(f){ scene.remove(f.mesh); }); if(queenMesh){ scene.remove(queenMesh); queenMesh=null; } }
function spawnQueen(x,z){ G.queen={x:x,z:z,carrier:-1}; if(!queenMesh){ queenMesh=makeQueen(); scene.add(queenMesh); } queenMesh.position.set(x,0,z); queenMesh.visible=true; }

/* ---------- input ---------- */
function padInput(p,inp){ if(!p||!p.connected) return; var ax=p.axes[0]||0, ay=p.axes[1]||0, B=function(i){ return p.buttons[i]&&p.buttons[i].pressed; }; if(ay<-0.4||B(12)) inp.u=1; if(ay>0.4||B(13)) inp.d=1; if(ax<-0.4||B(14)) inp.l=1; if(ax>0.4||B(15)) inp.r=1; if(B(0)||B(7)) inp.f=1; if(B(4)) inp.sl=1; if(B(5)) inp.sr=1; if(B(1)){ inp.sl=inp.l; inp.sr=inp.r; inp.l=inp.r=0; } }
function slotInput(slot){ var k=KEYS[slot], inp={u:keys[k.u]?1:0,d:keys[k.d]?1:0,l:keys[k.l]?1:0,r:keys[k.r]?1:0,f:keys[k.f]?1:0,sl:keys[k.sl]?1:0,sr:keys[k.sr]?1:0}; var pads=navigator.getGamepads?navigator.getGamepads():[]; padInput(pads[slot],inp); return inp; }
function readInputs(){ G.tanks.forEach(function(t){ if(t.bot) return; if(net.role==="host"){ if(t.owner===net.id) t.inp=slotInput(0); else { var ri=net.inputs[t.owner]; if(ri) t.inp=ri; } } else if(!net.role) t.inp=slotInput(t.owner); }); }
function clientInput(){ var inp=slotInput(0), s=JSON.stringify(inp); if(s!==net.lastSent){ net.lastSent=s; if(net.host&&net.host.open) net.host.send({t:"i",i:inp}); } }

/* ---------- simulation ---------- */
function hitWall(x,z,r){ for(var i=0;i<walls.length;i++){ var w=walls[i]; if(w.hp<=0) continue; if(x+r>w.x-w.w/2&&x-r<w.x+w.w/2&&z+r>w.z-w.d/2&&z-r<w.z+w.d/2) return w; } return null; }
function tankAt(x,z,self){ for(var i=0;i<G.tanks.length;i++){ var t=G.tanks[i]; if(t!==self&&t.alive&&Math.hypot(t.x-x,t.z-z)<2.6) return t; } return null; }
function damageWall(w,n){ if(w.hp>=1e9) return; w.hp-=n; if(w.hp<=0){ w.mesh.scale.y=0.15; w.mesh.position.y=w.h*0.075; w.mesh.material=rubbleMat; } }
function botThink(t,dt){
  t.ai.t-=dt; var best=null, bd=1e9, inp={u:0,d:0,l:0,r:0,f:0,sl:0,sr:0};
  if(G.mode==="queen"&&G.queen&&G.queen.carrier<0){ var dq=Math.hypot(G.queen.x-t.x,G.queen.z-t.z); if(dq<bd){ bd=dq; best={x:G.queen.x,z:G.queen.z,queen:true}; } }
  if(G.mode==="queen"&&t.hasQueen){ best={x:G.bases[t.i][0],z:G.bases[t.i][1],base:true}; bd=Math.hypot(best.x-t.x,best.z-t.z); }
  if(!best||best.queen){ G.tanks.forEach(function(o){ if(o===t||!o.alive) return; var d=Math.hypot(o.x-t.x,o.z-t.z); if(d<bd*(best&&best.queen?0.6:1)){ bd=d; best=o; } }); }
  if(best){ var want=Math.atan2(best.x-t.x,best.z-t.z), diff=Math.atan2(Math.sin(want-t.a),Math.cos(want-t.a));
    if(diff>0.1) inp.l=1; else if(diff<-0.1) inp.r=1;
    if(!best.queen&&!best.base&&Math.abs(diff)<0.25&&bd<45) inp.f=1;
    if(best.queen||best.base||bd>14) inp.u=1; else if(bd<7) inp.d=1;
    if(t.ai.t<=0){ t.ai.t=0.8+Math.random(); t.ai.jig=Math.random()<0.5?(Math.random()<0.5?"sl":"sr"):null; }
    if(t.ai.jig&&bd<25&&!best.queen) inp[t.ai.jig]=1;
    if(t.ai.stuck>0.6){ inp.u=0; inp.d=1; inp.r=1; if(t.ai.stuck>1.6) t.ai.stuck=0; }
  }
  t.inp=inp;
}
function spawnBullet(t,type,a,spd,extra){ var b={x:t.x+Math.sin(a)*2.4,y:1.4,z:t.z+Math.cos(a)*2.4,vx:Math.sin(a)*spd,vz:Math.cos(a)*spd,o:t.i,type:type,life:type==="flame"?0.6:4,mesh:new THREE.Mesh(type==="missile"||type==="swarm"?missileGeo:bulletGeo,bulletMats[type]||bulletMats.shell)}; if(extra) for(var k in extra) b[k]=extra[k]; b.mesh.position.set(b.x,b.y,b.z); scene.add(b.mesh); G.bullets.push(b); return b; }

  hx.textAlign="right"; hx.font="bold 16px Impact,Verdana"; hx.fillStyle="#f90"; hx.fillText(WEAP[t.w].n+(t.w==="shell"?"":"  x"+t.ammo),w-14,28);
  // score
  hx.font="bold 13px Verdana"; hx.fillStyle="#fff"; hx.textAlign="left";
  var line=G.mode==="dm"?"KILLS "+t.kills+" / "+G.target:G.mode==="queen"?"QUEENLORD "+t.score+" / 3"+(t.hasQueen?"  (CARRYING)":""):"LIVES "+t.lives+"  KILLS "+t.kills;
  hx.fillText(line,14,h-16);
  // standings
  hx.textAlign="right"; hx.font="11px Verdana"; G.tanks.forEach(function(o,i){ hx.fillStyle=COLORS[o.i%4]; hx.fillText(o.name+" "+(G.mode==="queen"?o.score:G.mode==="ann"?o.lives+"L/"+o.kills+"K":o.kills),w-14,h-58+i*13); });
  // radar
  var rx=w-70, ry=70, rr=48; hx.fillStyle="rgba(0,30,0,.55)"; hx.beginPath(); hx.arc(rx,ry,rr,0,7); hx.fill(); hx.strokeStyle="#3a3"; hx.lineWidth=1; hx.stroke();
  G.tanks.forEach(function(o){ if(!o.alive) return; var dx=o.x-t.x, dz=o.z-t.z, lx=(dx*Math.cos(-t.a)-dz*Math.sin(-t.a)), lz=(dx*Math.sin(-t.a)+dz*Math.cos(-t.a)); var px=lx/MAP*rr*1.6, pz=-lz/MAP*rr*1.6; if(Math.hypot(px,pz)>rr-3) return; hx.fillStyle=o===t?"#fff":COLORS[o.i%4]; hx.fillRect(rx+px-2,ry+pz-2,4,4); });
  if(G.mode==="queen"&&G.queen){ var qx=(G.queen.carrier>=0?G.tanks[G.queen.carrier].x:G.queen.x)-t.x, qz=(G.queen.carrier>=0?G.tanks[G.queen.carrier].z:G.queen.z)-t.z, lqx=(qx*Math.cos(-t.a)-qz*Math.sin(-t.a)), lqz=(qx*Math.sin(-t.a)+qz*Math.cos(-t.a)); var ppx=lqx/MAP*rr*1.6, ppz=-lqz/MAP*rr*1.6; if(Math.hypot(ppx,ppz)<rr-3){ hx.fillStyle="#ff2a8a"; hx.beginPath(); hx.arc(rx+ppx,ry+ppz,3,0,7); hx.fill(); } }
  if(!t.alive){ hx.fillStyle="rgba(120,0,0,.45)"; hx.fillRect(0,0,w,h); hx.fillStyle="#fff"; hx.font="bold 30px Impact,Verdana"; hx.textAlign="center"; hx.fillText(G.mode==="ann"&&t.lives<=0?"ELIMINATED":"DESTROYED",w/2,h/2); }
  else if(t.hurt>0){ hx.fillStyle="rgba(255,0,0,.18)"; hx.fillRect(0,0,w,h); }
  if(G.over){ hx.fillStyle="rgba(0,0,0,.55)"; hx.fillRect(0,h/2-36,w,72); hx.fillStyle="#f90"; hx.font="bold 40px Impact,Verdana"; hx.textAlign="center"; hx.fillText(G.winner===null?"EVERYONE LOSES":G.tanks[G.winner].name.toUpperCase()+" WINS",w/2,h/2+14); }
  hx.restore();
}
function loop(t){
  if(!running) return; var dt=Math.min(0.05,(t-lastT)/1000||0.016); lastT=t;
  if(net.role==="client") clientInput(); else if(G&&!menuOpen){ readInputs(); if(!G.over) simulate(dt); if(net.role==="host"){ bt+=dt; if(bt>0.05){ bt=0; broadcast(); } } }
  render(dt); requestAnimationFrame(loop);
}

/* ---------- UI ---------- */
function panel(html){ ui.style.display="flex"; ui.innerHTML="<div class='panel'>"+html+"<div id='msg'></div></div>"; }
function setMsg(t){ var m=document.getElementById("msg"); if(m) m.textContent=t; }
function tankSel(id,val){ var s="<select id='"+id+"'>"; for(var k in TANKS) s+="<option value='"+k+"'"+(k===val?" selected":"")+">"+TANKS[k].n+"</option>"; return s+"</select>"; }
function gate(){
  var ok=false; try{ ok=sessionStorage.getItem("btx")==="1"; }catch(e){}
  if(ok){ mainMenu(); return; }
  panel("<h1>BATTLETANX</h1><p>Restricted area. Enter the password.</p><div class='row'><input id='pw' type='password' placeholder='password'> <button id='go'>Enter</button></div>");
  var inp=document.getElementById("pw"); function tryIt(){ if(inp.value===PASS){ try{ sessionStorage.setItem("btx","1"); }catch(e){} mainMenu(); } else { setMsg("Wrong. Three of something."); inp.value=""; } }
  document.getElementById("go").onclick=tryIt; inp.onkeydown=function(e){ if(e.key==="Enter") tryIt(); }; inp.focus();
}
function mainMenu(){
  running=false; clearScene(); G=null; menuOpen=false; if(net.peer){ try{ net.peer.destroy(); }catch(e){} } net.role=null; net.peer=null; net.conns=[]; net.host=null; net.shown=false; cams=[];
  var modes="<select id='mode'><option value='dm'>Deathmatch (first to 10 kills)</option><option value='ann'>Annihilation (3 lives, last tank standing)</option><option value='queen'>Battlelord (capture the Queenlord 3 times)</option></select>";
  panel("<h1>BATTLETANX</h1><p>Third-person tank war in a ruined city. Blow the buildings down. Grab the glowing pickups: guided missiles, swarm missiles, laser, flamethrower, land mines, the nuke, health, shields.</p>"+
    "<h2>LOCAL (split-screen, 1-4 players)</h2><div class='row'>Players <select id='local'><option>1</option><option>2</option><option>3</option><option>4</option></select> &nbsp; Bots <select id='bots'><option>0</option><option>1</option><option>2</option><option>3</option></select> &nbsp; Mode "+modes+"</div>"+
    "<div class='row'><table class='t'><tr><td>P1</td><td>"+tankSel("t0",settings.tank[0])+"</td><td>P2</td><td>"+tankSel("t1",settings.tank[1])+"</td></tr><tr><td>P3</td><td>"+tankSel("t2",settings.tank[2])+"</td><td>P4</td><td>"+tankSel("t3",settings.tank[3])+"</td></tr></table></div><p>M1A1 Abrams: balanced. Goliath: slow, heavy armor, hits hard. Moto-Tank: fast and fragile.</p><button id='start'>Start</button>"+
    "<h2>ONLINE (friends on their own screens)</h2><div class='row'>Name <input id='name' maxlength='12' value='"+(localStorage.getItem("btxname")||"")+"' placeholder='name' style='width:120px'> &nbsp; Your tank "+tankSel("ot",settings.tank[0])+"</div><div class='row'><button id='host'>Host a room</button> <input id='code' maxlength='4' placeholder='CODE' style='width:70px;text-transform:uppercase'> <button id='join' class='alt'>Join</button></div><p>The host gets a 4-letter code. Up to 4 tanks per room, bots fill empty seats. Peer-to-peer, so same continent works best.</p>");
  document.getElementById("local").value=settings.local; document.getElementById("bots").value=settings.bots; document.getElementById("mode").value=settings.mode;
  function grab(){ settings.local=+document.getElementById("local").value; settings.bots=+document.getElementById("bots").value; settings.mode=document.getElementById("mode").value; for(var i=0;i<4;i++) settings.tank[i]=document.getElementById("t"+i).value; var n=document.getElementById("name").value.trim(); try{ localStorage.setItem("btxname",n); }catch(e){} return n||"Player"; }
  document.getElementById("start").onclick=function(){ grab(); if(settings.local+settings.bots<2) settings.bots=1; startLocal(); };
  document.getElementById("host").onclick=function(){ var n=grab(); settings.tank[0]=document.getElementById("ot").value; hostRoom(n); };
  document.getElementById("join").onclick=function(){ var n=grab(), c=document.getElementById("code").value.trim(); if(c.length!==4){ setMsg("Enter the 4-letter code."); return; } joinRoom(c,n,document.getElementById("ot").value); };
}
function lobbyHost(code){
  var names=[net.names.host].concat(net.conns.map(function(c){ return net.names[c.peer]||"..."; }));
  panel("<h1>ROOM <code>"+code+"</code></h1><p>Friends: open this page, enter the password, type the code, Join.</p><p>Players: "+names.join(", ")+"</p><div class='row'>Bots <select id='bots'><option>0</option><option>1</option><option>2</option><option>3</option></select> &nbsp; Mode <select id='mode'><option value='dm'>Deathmatch</option><option value='ann'>Annihilation</option><option value='queen'>Battlelord (Queenlord)</option></select></div><button id='start'>Start</button> <button class='alt' id='back'>Cancel</button>");
  document.getElementById("bots").value=Math.min(settings.bots,4-names.length); document.getElementById("mode").value=settings.mode;
  net.conns.forEach(function(c){ if(c.open) c.send({t:"lobby",names:names}); });
  document.getElementById("start").onclick=function(){ settings.bots=+document.getElementById("bots").value; settings.mode=document.getElementById("mode").value; startLocal(); };
  document.getElementById("back").onclick=mainMenu;
}
function startLocal(){ ui.innerHTML=""; ui.style.display="none"; clearScene(); cams=[]; newGame(); running=true; menuOpen=false; lastT=performance.now(); requestAnimationFrame(loop); }
function showResults(){
  if(!G) return; var rows=G.tanks.slice().sort(function(a,b){ return (b.score||b.kills)-(a.score||a.kills)||b.kills-a.kills; }).map(function(t){ return "<p style='color:"+COLORS[t.i%4]+"'><b>"+t.name+"</b> ("+TANKS[t.type].n+") &nbsp; kills "+t.kills+" &nbsp; deaths "+t.deaths+(G.mode==="queen"?" &nbsp; captures "+t.score:"")+"</p>"; }).join("");
  var title=G.winner===null?"EVERYONE LOSES":G.tanks[G.winner].name.toUpperCase()+" WINS";
  if(net.role==="client"){ panel("<h1>"+title+"</h1>"+rows+"<p>Waiting for the host...</p><button class='alt' id='back'>Leave</button>"); document.getElementById("back").onclick=function(){ location.reload(); }; return; }
  panel("<h1>"+title+"</h1>"+rows+"<button id='again'>Rematch</button> <button class='alt' id='back'>Menu</button>");
  document.getElementById("again").onclick=function(){ net.shown=false; startLocal(); };
  document.getElementById("back").onclick=function(){ if(net.role==="host") location.reload(); else mainMenu(); };
}
function toggleMenu(){ if(!running||net.role==="client"||!G||G.over) return; if(menuOpen){ menuOpen=false; ui.innerHTML=""; ui.style.display="none"; } else { menuOpen=true; panel("<h1>PAUSED</h1><button id='res'>Resume</button> <button class='alt' id='quit'>Quit to menu</button>"); document.getElementById("res").onclick=toggleMenu; document.getElementById("quit").onclick=function(){ if(net.role==="host") location.reload(); else mainMenu(); }; } }
gate();
})();
</script>
</body>
</html>
