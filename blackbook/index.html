<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Black Book</title>
<style>
  body { margin: 16px; background: #000; color: #fff; font-family: Arial, Helvetica, sans-serif; font-size: 16px; max-width: 640px; }
  p { margin: 0 0 16px; }
  a { color: #fff; }
  .gap { margin-top: 48px; }
  #page { margin-top: 48px; }
</style>
</head>
<body>
  <p><a href="/">Holy Fire</a> / <a href="/blackbook/">the black book</a></p>
  <div id="page"></div>
  <script src="/blackbook/pages.js"></script>
  <script>
    (function () {
      var pages = window.BLACK_BOOK || [];
      if (!pages.length) return;
      var last = -1;
      try { last = parseInt(localStorage.getItem("blackbook-last"), 10); } catch (e) {}
      var i, want = parseInt(new URLSearchParams(location.search).get("page"), 10);
      if (want >= 1 && want <= pages.length) i = want - 1;
      else if (pages.length === 1) i = 0;
      else { do { i = Math.floor(Math.random() * pages.length); } while (i === last); }
      try { localStorage.setItem("blackbook-last", String(i)); } catch (e) {}
      var page = pages[i], el = document.getElementById("page");
      document.title = page.title;
      function render(lines, into) {
        var gap = false;
        lines.forEach(function (line) {
          if (line === "") { gap = true; return; }
          var p = document.createElement("p");
          p.textContent = line;
          if (gap) { p.className = "gap"; gap = false; }
          into.appendChild(p);
        });
      }
      render(page.lines, el);
      // A page may hide more lines behind a phrase; clicking the phrase reveals them once.
      if (page.hidden && page.hidden.trigger) {
        var ps = el.querySelectorAll("p"), t = page.hidden.trigger;
        for (var k = ps.length - 1; k >= 0; k--) {
          var at = ps[k].textContent.lastIndexOf(t);
          if (at < 0) continue;
          var text = ps[k].textContent, span = document.createElement("span");
          span.textContent = t;
          ps[k].textContent = "";
          ps[k].appendChild(document.createTextNode(text.slice(0, at)));
          ps[k].appendChild(span);
          ps[k].appendChild(document.createTextNode(text.slice(at + t.length)));
          span.addEventListener("click", function () {
            if (el.dataset.revealed) return;
            el.dataset.revealed = "1";
            render([""].concat(page.hidden.lines), el);
          });
          break;
        }
      }
    })();
  </script>
</body>
</html>
