<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Black Book</title>
<style>
  body { margin: 16px; background: #000; color: #fff; font-family: Arial, Helvetica, sans-serif; font-size: 16px; max-width: 640px; }
  p { margin: 0 0 16px; }
  a { color: #fff; }
  .gap { margin-top: 48px; }
  #page { margin-top: 48px; }
</style>
</head>
<body>
  <p><a href="/">Holy Fire</a> / <a href="/blackbook/">the black book</a></p>
  <div id="page"></div>
  <script src="/blackbook/pages.js"></script>
  <script>
    (function () {
      var pages = window.BLACK_BOOK || [];
      if (!pages.length) return;
      var last = -1;
      try { last = parseInt(localStorage.getItem("blackbook-last"), 10); } catch (e) {}
      var i;
      if (pages.length === 1) i = 0;
      else { do { i = Math.floor(Math.random() * pages.length); } while (i === last); }
      try { localStorage.setItem("blackbook-last", String(i)); } catch (e) {}
      var page = pages[i], el = document.getElementById("page"), gap = false;
      document.title = page.title;
      page.lines.forEach(function (line) {
        if (line === "") { gap = true; return; }
        var p = document.createElement("p");
        p.textContent = line;
        if (gap) { p.className = "gap"; gap = false; }
        el.appendChild(p);
      });
    })();
  </script>
</body>
</html>
